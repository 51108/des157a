<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Unicase:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>    

    <title>An Evening at the Tavern | Mad Libs V2</title>
</head>
<body>    
    <header>
        <a href="../../index.html"><strong>Back to Portal</strong></a>
        <img src="images/banner.png" width="311" height="81" alt="">
        <h1>An Evening at the Tavern</h1>
        <h2>Fill in the blanks to find out what happens at the tavern</h2>
    </header>

    <main>
        <form>
            <label for="adjective">An adjective:</label>
            <input type="text" id="adjective" required>

            <label for="plural-noun">A plural noun:</label>
            <input type="text" id="plural-noun" required>

            <label for="food">A food:</label>
            <input type="text" id="food" required>
        
            <label for="occupation">An occupation:</label>
            <input type="text" id="occupation" required>
            
            <label for="object">An object you could carry:</label>
            <input type="text" id="object" required>
            
            <label for="verb-ing">A verb ending in "-ing":</label>
            <input type="text" id="verb-ing" required>
            
            <label for="number">A number greater than one:</label>
            <input type="number" id="number" required>
        
            <label for="place">A place:</label>
            <input type="text" id="place" required>
            
            <label for="exclamation">An exclamation:</label>
            <input type="text" id="exclamation" required>

            <label for="drink">A drink:</label>
            <input type="text" id="drink" required>

            <img src="images/dragon.png" width="652" height="578" alt="dragon with trumpet illustration">

            <input type="submit" value="Tell my tale!">  

        </form>

        <section class="hidden"></section>
    </main>
    
</body>
</html>
